<!DOCTYPE html>
<html lang="fr">
<head>
<!-- Charte graphique FOXSCAN : jetons partagés, source unique -->
<link rel="stylesheet" href="../assets/foxscan-tokens.css">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Paiement confirmé · FOXSCAN</title>
<meta name="robots" content="noindex,nofollow"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,sans-serif;background:linear-gradient(135deg,var(--bg) 0%,var(--accent-tint) 100%);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{background:#fff;border-radius:24px;padding:48px 40px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.1);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--success),var(--success))}
.icon{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--success),var(--success));color:#fff;font-size:48px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 12px 28px rgba(52,199,89,.35);animation:pop .5s cubic-bezier(.5,0,.3,1.5)}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
h1{font-size:28px;font-weight:800;margin-bottom:12px;letter-spacing:-.5px}
p{font-size:15px;color:var(--ink-3);line-height:1.6;margin-bottom:14px}
.amount{font-size:42px;font-weight:800;color:var(--ink);letter-spacing:-1px;margin:24px 0 6px;background:linear-gradient(135deg,var(--success),var(--success));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.amount-sub{font-size:13px;color:var(--ink-4);font-weight:500;margin-bottom:28px}
.email-box{background:var(--bg-soft);border-radius:12px;padding:16px 20px;margin:24px 0;font-size:14px;color:var(--ink)}
.email-box strong{color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;text-decoration:none;padding:14px 28px;border-radius:12px;font-weight:700;font-size:15px;transition:.2s;margin:8px 4px;border:none;cursor:pointer;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.2)}
.btn-secondary{background:var(--bg-soft);color:var(--ink)}
.btn-secondary:hover{background:var(--ink-5);box-shadow:none}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid var(--ink-5);border-top-color:var(--success);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{text-align:left;background:var(--bg-soft);border-radius:12px;padding:18px 22px;margin:24px 0}
.steps h3{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.steps ol{margin-left:18px;font-size:13px;color:var(--ink-3);line-height:1.7}
.steps li::marker{color:var(--success);font-weight:700}
.error-box{background:var(--danger-tint);border-left:3px solid var(--danger);padding:14px 18px;border-radius:10px;color:var(--danger);font-size:13px;margin:14px 0;text-align:left}
</style>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

<div class="card">
  <div class="icon">✓</div>
  <h1 id="title">Paiement confirmé !</h1>
  <p id="subtitle">Merci. Nous validons votre paiement…</p>

  <div id="loadingBlock">
    <div class="spinner"></div>
    <p style="margin-top:12px;font-size:13px;color:var(--ink-4)">Chargement des informations de paiement…</p>
  </div>

  <div id="successBlock" style="display:none">
    <div class="amount" id="amountDisplay">—</div>
    <div class="amount-sub" id="amountSub">Paiement réussi</div>

    <div class="email-box" id="emailBlock" style="display:none">
      📧 Confirmation envoyée à <strong id="emailDisplay">—</strong>
    </div>

    <div class="steps" id="stepsBlock">
      <h3>Prochaines étapes :</h3>
      <ol id="stepsList"></ol>
    </div>

    <a href="https://foxscan.fr" class="btn">Retour à l'accueil →</a>
    <a href="https://foxscan.fr/login.html" class="btn btn-secondary">Se connecter au dashboard</a>
  </div>

  <div id="errorBlock" style="display:none">
    <div class="error-box" id="errorMsg"></div>
    <a href="https://foxscan.fr" class="btn">Retour à l'accueil</a>
    <a href="mailto:contact@foxscan.fr" class="btn btn-secondary">Contacter le support</a>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const sessionId = params.get('session_id');
const type = params.get('type'); // "founders" | "subscription"

// F3 — Track funnel completion (best-effort, ne bloque rien si échec).
fetch('/track/funnel', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    step: 'checkout.success',
    sessionId: sessionId || '',
    meta: { type: type || 'unknown' },
  }),
}).catch(() => {});

async function loadSession() {
  if (!sessionId) {
    showSuccessGeneric();
    return;
  }
  try {
    const res = await fetch(`/checkout/session/${encodeURIComponent(sessionId)}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    document.getElementById('loadingBlock').style.display = 'none';
    document.getElementById('successBlock').style.display = 'block';

    const amount = (data.amountTotal || 0) / 100;
    const currency = (data.currency || 'eur').toUpperCase();
    document.getElementById('amountDisplay').textContent = `${amount.toFixed(2)} ${currency === 'EUR' ? '€' : currency}`;
    document.getElementById('amountSub').textContent = data.mode === 'subscription'
      ? `Abonnement mensuel · ${data.metadata?.users || '?'} utilisateur(s)`
      : 'Paiement unique · Licence à vie';

    if (data.customerEmail) {
      document.getElementById('emailBlock').style.display = 'block';
      document.getElementById('emailDisplay').textContent = data.customerEmail;
    }

    const steps = type === 'founders' ? [
      "Notre équipe vous envoie un mail de bienvenue sous 24h",
      "Vous recevrez vos identifiants FOXSCAN définitifs (compte à vie)",
      "L'app iOS est dispo gratuitement sur l'App Store",
      "Vous gardez toutes les mises à jour à vie, sans frais supplémentaires",
    ] : [
      "Votre abonnement est désormais actif",
      "Téléchargez l'app FOXSCAN sur l'App Store si ce n'est pas déjà fait",
      "Connectez-vous avec l'email utilisé pour le paiement",
      "Votre dashboard web est accessible sur foxscan.fr/dashboard/",
    ];
    document.getElementById('stepsList').innerHTML = steps.map(s => `<li>${s}</li>`).join('');
  } catch (err) {
    showError("Impossible de récupérer les infos de paiement, mais ne vous inquiétez pas — Stripe nous a notifié votre paiement. Vous recevrez un email de confirmation sous peu.");
  }
}

function showSuccessGeneric() {
  document.getElementById('loadingBlock').style.display = 'none';
  document.getElementById('successBlock').style.display = 'block';
  document.getElementById('amountDisplay').textContent = '✓';
  document.getElementById('amountSub').textContent = 'Paiement réussi';
  document.getElementById('stepsList').innerHTML = '<li>Vous recevrez un email de confirmation sous peu.</li>';
}

function showError(msg) {
  document.getElementById('loadingBlock').style.display = 'none';
  document.getElementById('errorBlock').style.display = 'block';
  document.getElementById('errorMsg').textContent = msg;
}

loadSession();
</script>

</body>
</html>
